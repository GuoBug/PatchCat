<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" className="w-full h-full">
  <!-- Solid White Background -->
  <rect width="200" height="200" fill="#ffffff" rx="16" />

  <!-- Bold Black Outer Frame & Geometry -->
  <g stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ear & Jaw Contour -->
    <path d="M42 30 L42 116 L100 172" />
    <path d="M42 30 L78 62 L120 62 L160 30" />
    <!-- Right Ear & Jaw Contour -->
    <path d="M160 30 L146 102 L160 116 L100 172" />

    <!-- Left Ear Inner Accent Notch -->
    <path d="M54 74 L68 84" stroke-width="4.5" />

    <!-- Eyepatch Diagonal Strap -->
    <path d="M120 62 L42 122" stroke-width="5" />

    <!-- Nose & Mouth Mark -->
    <path d="M90 128 L110 128" stroke-width="5" />
    <path d="M100 128 L100 144" stroke-width="5" />
    <path d="M84 152 L100 144 L116 152 L100 166 Z" stroke-width="4.5" />
  </g>

  <!-- Solid Black Geometric Eyepatch (Covering Left Eye) -->
  <polygon
    points="62,94 96,94 94,124 64,124"
    fill="#000000"
    stroke="#000000"
    stroke-width="3"
    stroke-linejoin="round"
  />
</svg>
