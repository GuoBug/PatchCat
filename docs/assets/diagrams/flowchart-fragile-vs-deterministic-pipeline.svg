<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" style="background: transparent; display: block;">
  <defs>
    <!-- Background Dot Grid -->
    <pattern id="dot-grid-p1" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#D4D4D8" />
    </pattern>

    <!-- Marker Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF4D4D" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7FFF00" stroke="#000000" stroke-width="1.5"/>
    </marker>

    <style>
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'PingFang SC', monospace; }
      .font-heading { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif; }
      .bold { font-weight: 700; }
      .border-main { stroke: #000000; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
      .border-card { stroke: #000000; stroke-width: 2; }
      .border-thin { stroke: #000000; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- ================= Outer Container (Neo-Brutalist) ================= -->
  <rect x="14" y="14" width="932" height="342" rx="6" fill="#000000" />
  <rect x="10" y="10" width="932" height="342" rx="6" fill="#FAF9F5" class="border-main" />
  <rect x="13" y="13" width="926" height="336" rx="4" fill="url(#dot-grid-p1)" />

  <!-- ================= Header Bar ================= -->
  <rect x="26" y="24" width="900" height="42" rx="4" fill="#000000" />
  <rect x="23" y="21" width="900" height="42" rx="4" fill="#FFFFFF" class="border-card" />

  <rect x="32" y="29" width="168" height="26" rx="3" fill="#7FFF00" class="border-thin" />
  <text x="116" y="46" class="font-mono bold" font-size="10.5" fill="#000000" text-anchor="middle" letter-spacing="1">PIPELINE // COMPARISON</text>

  <text x="212" y="47" class="font-heading bold" font-size="13.5" fill="#000000" letter-spacing="0.5">TRADITIONAL FRAGILE PIPELINE vs PATCHCAT DETERMINISTIC GUARD</text>
  <text x="746" y="47" class="font-mono" font-size="10" fill="#52525B">ENGINE INTEGRITY v0.4.12</text>

  <!-- ================= Lane 1: Fragile Traditional Flow ================= -->
  <g id="fragile-lane">
    <!-- Lane Container Shadow & Box -->
    <rect x="26" y="78" width="900" height="118" rx="5" fill="#000000" />
    <rect x="23" y="75" width="900" height="118" rx="5" fill="#FFF5F5" class="border-card" />

    <!-- Lane Tag -->
    <rect x="35" y="85" width="124" height="22" rx="3" fill="#FF4D4D" class="border-thin" />
    <text x="97" y="100" class="font-mono bold" font-size="10" fill="#000000" text-anchor="middle">脆弱链路 (无防御)</text>

    <!-- Node 1: LLM Freeform -->
    <rect x="38" y="116" width="170" height="62" rx="4" fill="#000000" />
    <rect x="35" y="113" width="170" height="62" rx="4" fill="#FFFFFF" class="border-thin" />
    <text x="120" y="137" class="font-heading bold" font-size="12" fill="#000000" text-anchor="middle">LLM 自由输出</text>
    <text x="120" y="157" class="font-mono" font-size="10" fill="#71717A" text-anchor="middle">纯 Prompt 软性引导</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="210" y1="144" x2="252" y2="144" stroke="#FF4D4D" stroke-width="2.5" marker-end="url(#arrow-red)" />

    <!-- Node 2: Noise / Token Gap -->
    <rect x="265" y="116" width="180" height="62" rx="4" fill="#000000" />
    <rect x="262" y="113" width="180" height="62" rx="4" fill="#FFFFFF" class="border-thin" />
    <text x="352" y="137" class="font-heading bold" font-size="12" fill="#DC2626" text-anchor="middle">混杂文本 / 残缺括号</text>
    <text x="352" y="157" class="font-mono" font-size="10" fill="#71717A" text-anchor="middle">前缀闲聊 · Markdown围栏</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="447" y1="144" x2="489" y2="144" stroke="#FF4D4D" stroke-width="2.5" marker-end="url(#arrow-red)" />

    <!-- Node 3: JSON.parse Crash -->
    <rect x="502" y="116" width="175" height="62" rx="4" fill="#000000" />
    <rect x="499" y="113" width="175" height="62" rx="4" fill="#FFFFFF" class="border-thin" />
    <text x="586" y="137" class="font-mono bold" font-size="12" fill="#DC2626" text-anchor="middle">JSON.parse() 崩溃</text>
    <text x="586" y="157" class="font-mono" font-size="9.5" fill="#EF4444" text-anchor="middle">SyntaxError 未受控抛错</text>

    <!-- Arrow 3 -> 4 -->
    <line x1="679" y1="144" x2="721" y2="144" stroke="#FF4D4D" stroke-width="2.5" marker-end="url(#arrow-red)" />

    <!-- Node 4: Fatal Crash Alert Box -->
    <rect x="734" y="116" width="175" height="62" rx="4" fill="#000000" />
    <rect x="731" y="113" width="175" height="62" rx="4" fill="#FF4D4D" class="border-card" />
    <text x="818" y="138" class="font-heading bold" font-size="12.5" fill="#000000" text-anchor="middle">💥 DAG 拓扑中断死锁</text>
    <text x="818" y="158" class="font-mono bold" font-size="9.5" fill="#000000" text-anchor="middle">事件循环猝死 · Eval 中断</text>
  </g>

  <!-- ================= Lane 2: Robust Deterministic Flow ================= -->
  <g id="robust-lane">
    <!-- Lane Container Shadow & Box -->
    <rect x="26" y="210" width="900" height="126" rx="5" fill="#000000" />
    <rect x="23" y="207" width="900" height="126" rx="5" fill="#F0FDF4" class="border-card" />

    <!-- Lane Tag -->
    <rect x="35" y="217" width="144" height="22" rx="3" fill="#7FFF00" class="border-thin" />
    <text x="107" y="232" class="font-mono bold" font-size="10" fill="#000000" text-anchor="middle">PatchCat 确定性防线</text>

    <!-- Node 1: LLM Node Negotiated -->
    <rect x="38" y="249" width="170" height="68" rx="4" fill="#000000" />
    <rect x="35" y="246" width="170" height="68" rx="4" fill="#FFFFFF" class="border-thin" />
    <text x="120" y="271" class="font-heading bold" font-size="12" fill="#000000" text-anchor="middle">LLM 节点调度</text>
    <text x="120" y="291" class="font-mono" font-size="9.5" fill="#16A34A" text-anchor="middle">三级显式协商响应模式</text>
    <text x="120" y="304" class="font-mono" font-size="8.5" fill="#71717A" text-anchor="middle">Strict / Object / None</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="210" y1="280" x2="252" y2="280" stroke="#7FFF00" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- Node 2: L1 Constrained & Repair -->
    <rect x="265" y="249" width="180" height="68" rx="4" fill="#000000" />
    <rect x="262" y="246" width="180" height="68" rx="4" fill="#FFFFFF" class="border-thin" />
    <text x="352" y="271" class="font-heading bold" font-size="12" fill="#000000" text-anchor="middle">L1 物理语法防御</text>
    <text x="352" y="291" class="font-mono bold" font-size="9.5" fill="#16A34A" text-anchor="middle">Logits Masking 采样约束</text>
    <text x="352" y="304" class="font-mono" font-size="8.5" fill="#71717A" text-anchor="middle">repairJsonL1 毫秒剥壳补括号</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="447" y1="280" x2="489" y2="280" stroke="#7FFF00" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- Node 3: L2 Zod Contract Guard -->
    <rect x="502" y="249" width="175" height="68" rx="4" fill="#000000" />
    <rect x="499" y="246" width="175" height="68" rx="4" fill="#FFFFFF" class="border-thin" />
    <text x="586" y="271" class="font-heading bold" font-size="12" fill="#000000" text-anchor="middle">L2 业务契约守卫</text>
    <text x="586" y="291" class="font-mono bold" font-size="9.5" fill="#16A34A" text-anchor="middle">Zod.safeParse() 截流</text>
    <text x="586" y="304" class="font-mono" font-size="8.5" fill="#71717A" text-anchor="middle">数值越界 / 占位符 / 跨字段校验</text>

    <!-- Arrow 3 -> 4 -->
    <line x1="679" y1="280" x2="721" y2="280" stroke="#7FFF00" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- Node 4: Success Safe Payload -->
    <rect x="734" y="249" width="175" height="68" rx="4" fill="#000000" />
    <rect x="731" y="246" width="175" height="68" rx="4" fill="#7FFF00" class="border-card" />
    <text x="818" y="272" class="font-heading bold" font-size="12.5" fill="#000000" text-anchor="middle">✅ 强类型 Payload 交付</text>
    <text x="818" y="291" class="font-mono bold" font-size="9.5" fill="#000000" text-anchor="middle">零 Throw 异常流转</text>
    <text x="818" y="304" class="font-mono" font-size="8.5" fill="#000000" text-anchor="middle">下游 Condition / Eval 平稳消费</text>
  </g>
</svg>
