<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" style="background: transparent; display: block;">
  <defs>
    <!-- Background Dot Grid -->
    <pattern id="dot-grid-atlas" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#D4D4D8" />
    </pattern>

    <!-- Marker Arrowheads -->
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7FFF00" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF4D4D" stroke="#000000" stroke-width="1.5"/>
    </marker>

    <style>
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'PingFang SC', monospace; }
      .font-heading { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif; }
      .bold { font-weight: 700; }
      .border-main { stroke: #000000; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
      .border-card { stroke: #000000; stroke-width: 2; }
      .border-thin { stroke: #000000; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- ================= Outer Container ================= -->
  <rect x="14" y="14" width="932" height="522" rx="6" fill="#000000" />
  <rect x="10" y="10" width="932" height="522" rx="6" fill="#FAF9F5" class="border-main" />
  <rect x="13" y="13" width="926" height="516" rx="4" fill="url(#dot-grid-atlas)" />

  <!-- ================= Header Bar ================= -->
  <rect x="26" y="24" width="900" height="42" rx="4" fill="#000000" />
  <rect x="23" y="21" width="900" height="42" rx="4" fill="#FFFFFF" class="border-card" />

  <rect x="32" y="29" width="180" height="26" rx="3" fill="#7FFF00" class="border-thin" />
  <text x="122" y="46" class="font-mono bold" font-size="10.5" fill="#000000" text-anchor="middle" letter-spacing="1">DEFENSE ATLAS // MOD-0</text>

  <text x="224" y="47" class="font-heading bold" font-size="13.5" fill="#000000" letter-spacing="0.5">DETERMINISTIC STRUCTURED OUTPUT &amp; 4-TIER DEFENSE ATLAS</text>
  <text x="760" y="47" class="font-mono" font-size="10" fill="#52525B">ENGINE PURITY &amp; STATS</text>

  <!-- ================= Level 1: L1 & L2 (Top Row) ================= -->
  <!-- Box L1: Physical Syntax -->
  <rect x="29" y="85" width="438" height="106" rx="4" fill="#000000" />
  <rect x="26" y="82" width="438" height="106" rx="4" fill="#F0FDFA" class="border-card" />
  <rect x="36" y="90" width="150" height="20" rx="2" fill="#00E5FF" class="border-thin" />
  <text x="111" y="104" class="font-mono bold" font-size="9" fill="#000000" text-anchor="middle">L1 · 物理语法约束与协商</text>

  <text x="36" y="128" class="font-heading bold" font-size="12.5" fill="#0E7490">Logits Masking 与受限解码协商</text>
  <text x="36" y="148" class="font-mono" font-size="9" fill="#52525B">• 3 级协商矩阵：json_schema → json_object → none (平滑降级)</text>
  <text x="36" y="166" class="font-mono" font-size="9" fill="#52525B">• repairJsonL1 正则栈纳秒补全未闭合花括号，零时延剥离 Markdown 围栏</text>

  <!-- Arrow L1 -> L2 -->
  <line x1="464" y1="135" x2="492" y2="135" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-black)" />

  <!-- Box L2: Business Contract -->
  <rect x="499" y="85" width="435" height="106" rx="4" fill="#000000" />
  <rect x="496" y="82" width="435" height="106" rx="4" fill="#F0FDF4" class="border-card" />
  <rect x="506" y="90" width="150" height="20" rx="2" fill="#7FFF00" class="border-thin" />
  <text x="581" y="104" class="font-mono bold" font-size="9" fill="#000000" text-anchor="middle">L2 · 业务契约深度守卫</text>

  <text x="506" y="128" class="font-heading bold" font-size="12.5" fill="#166534">Zod 强类型安全断言与跨字段约束</text>
  <text x="506" y="148" class="font-mono" font-size="9" fill="#52525B">• 单一事实来源 (Single Source of Truth)：安全截流非法枚举与数值</text>
  <text x="506" y="166" class="font-mono" font-size="9" fill="#52525B">• superRefine 跨字段业务联动：违规处方结构化切片，绝不主动抛错</text>

  <!-- ================= Level 2: L3 & L4 (Middle Row) ================= -->
  <!-- Box L3: Self-Healing State Machine -->
  <rect x="29" y="208" width="438" height="114" rx="4" fill="#000000" />
  <rect x="26" y="205" width="438" height="114" rx="4" fill="#FFFBEB" class="border-card" />
  <rect x="36" y="213" width="150" height="20" rx="2" fill="#FBBF24" class="border-thin" />
  <text x="111" y="227" class="font-mono bold" font-size="9" fill="#000000" text-anchor="middle">L3 · 异构自愈状态机</text>

  <text x="36" y="251" class="font-heading bold" font-size="12.5" fill="#B45309">三元组精准纠错与形态分流</text>
  <text x="36" y="271" class="font-mono" font-size="9" fill="#52525B">• Clean Retry：应对 DeepSeek 偶发空响应，原始干净重发不污染上下文</text>
  <text x="36" y="289" class="font-mono" font-size="9" fill="#52525B">• Triad Feedback：原输出残片 + 路径诊断 + 黄金范式，激光收敛采样</text>
  <text x="36" y="307" class="font-mono bold" font-size="8.5" fill="#D97706">单轮定向自愈，杜绝无脑同构重试原地空转与客套性幻觉</text>

  <!-- Arrow L3 -> L4 -->
  <line x1="464" y1="262" x2="492" y2="262" stroke="#FF4D4D" stroke-width="2.5" marker-end="url(#arrow-red)" />

  <!-- Box L4: Never-Throw Graceful Degradation -->
  <rect x="499" y="208" width="435" height="114" rx="4" fill="#000000" />
  <rect x="496" y="205" width="435" height="114" rx="4" fill="#FEF2F2" class="border-card" />
  <rect x="506" y="213" width="150" height="20" rx="2" fill="#EF4444" class="border-thin" />
  <text x="581" y="227" class="font-mono bold" font-size="9" fill="#FFFFFF" text-anchor="middle">L4 · 终极确定性兜底</text>

  <text x="506" y="251" class="font-heading bold" font-size="12.5" fill="#B91C1C">Never-Throw 优雅降级契约</text>
  <text x="506" y="271" class="font-mono" font-size="9" fill="#52525B">• 3 轮耗尽或 max_tokens 物理截断时，坚决禁止 throw 抛错炸毁流水线</text>
  <text x="506" y="289" class="font-mono" font-size="9" fill="#52525B">• 注入 _validationFailed: true、残片与安全垫数据，带状态平滑下发</text>
  <text x="506" y="307" class="font-mono bold" font-size="8.5" fill="#DC2626">下游 DAG 状态机 (Kahn 拓扑排序) 保持常态运转，根治白屏卡死</text>

  <!-- Connector from L2 down to L3 -->
  <path d="M 600 188 L 600 200 L 245 200 L 245 205" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrow-black)" />

  <!-- ================= Level 3: Pillars of Excellence (Bottom Row) ================= -->
  <!-- Pillar 1: Architectural Purity -->
  <rect x="29" y="340" width="438" height="162" rx="4" fill="#000000" />
  <rect x="26" y="337" width="438" height="162" rx="4" fill="#FFFFFF" class="border-card" />
  <rect x="36" y="345" width="180" height="20" rx="2" fill="#18181B" class="border-thin" />
  <text x="126" y="359" class="font-mono bold" font-size="9" fill="#7FFF00" text-anchor="middle">架构纯度清洗 · SCHEMA REGISTRY</text>

  <text x="36" y="383" class="font-heading bold" font-size="12" fill="#000000">领域中立的契约注册中心与职责解耦</text>
  <text x="36" y="403" class="font-mono" font-size="8.8" fill="#52525B">• 试金石法则：调度引擎纯净无感知，跑任何全新业务无须改动引擎核心</text>
  <text x="36" y="421" class="font-mono" font-size="8.8" fill="#52525B">• 业务代码外迁：将 130 行工单场景彻底移出，归档至 src/presets/</text>
  <text x="36" y="439" class="font-mono" font-size="8.8" fill="#52525B">• 动态注册注入：registerSchema() / getSchema() 契约字典解耦依赖</text>
  <rect x="36" y="457" width="418" height="30" rx="2" fill="#F4F4F5" class="border-thin" />
  <text x="44" y="476" class="font-mono" font-size="8.5" fill="#18181B">权衡取舍：让渡编译期泛型推导，换取编排引擎无侵入通用性</text>

  <!-- Pillar 2: Empirical Evaluation -->
  <rect x="499" y="340" width="435" height="162" rx="4" fill="#000000" />
  <rect x="496" y="337" width="435" height="162" rx="4" fill="#FFFFFF" class="border-card" />
  <rect x="506" y="345" width="180" height="20" rx="2" fill="#18181B" class="border-thin" />
  <text x="596" y="359" class="font-mono bold" font-size="9" fill="#00E5FF" text-anchor="middle">实证科学评测 · MCNEMAR TEST</text>

  <text x="506" y="383" class="font-heading bold" font-size="12" fill="#000000">42 样本双口径配对检验与工程真相</text>
  <text x="506" y="403" class="font-mono" font-size="8.8" fill="#52525B">• By-Sample (n=42): 69.0% → 92.9% (+23.9%), p=0.00195 &lt; 0.01 (极显著)</text>
  <text x="506" y="421" class="font-mono" font-size="8.8" fill="#52525B">• By-Case (N=14): 11 个常规用例稳定放行，3 个极端边界成功修复</text>
  <text x="506" y="439" class="font-mono" font-size="8.8" fill="#52525B">• 坦承数据局限：用例样本基数下 p=0.125 未达显著，机制生效于定点兜底</text>
  <rect x="506" y="457" width="415" height="30" rx="2" fill="#F0FDF4" class="border-thin" />
  <text x="514" y="476" class="font-mono bold" font-size="8.5" fill="#166534">实测收益真相：L1 消除崩溃暴露深层错误，L3 精准纠偏闭合链路</text>
</svg>
