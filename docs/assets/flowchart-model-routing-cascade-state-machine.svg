<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" style="background: transparent; display: block; max-width: 100%; height: auto;">
  <defs>
    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid-m3" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.2" fill="#D4D4D8" />
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arr-blk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" stroke="#000000" stroke-width="1"/>
    </marker>
    <marker id="arr-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" stroke="#000000" stroke-width="1"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444" stroke="#000000" stroke-width="1"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" stroke="#000000" stroke-width="1"/>
    </marker>

    <style>
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'PingFang SC', monospace; }
      .font-heading { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif; }
      .bold { font-weight: 700; }
      .bolder { font-weight: 800; }
      .black { font-weight: 900; }
      .border-main { stroke: #000000; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
      .border-card { stroke: #000000; stroke-width: 2; }
      .border-thin { stroke: #000000; stroke-width: 1.5; }
      .border-dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .border-dashed-red { stroke: #EF4444; stroke-width: 2; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- Outer Shadow & Background Frame -->
  <rect x="14" y="14" width="932" height="652" rx="8" fill="#000000" />
  <rect x="10" y="10" width="932" height="652" rx="8" fill="#FAF9F5" class="border-main" />
  <rect x="14" y="14" width="924" height="644" rx="6" fill="url(#dot-grid-m3)" />

  <!-- ================= Top Header Bar ================= -->
  <rect x="28" y="24" width="896" height="52" rx="6" fill="#000000" />
  <rect x="25" y="21" width="896" height="52" rx="6" fill="#FFFFFF" class="border-card" />

  <rect x="36" y="29" width="180" height="34" rx="4" fill="#7FFF00" class="border-thin" />
  <text x="126" y="51" class="font-mono bolder" font-size="12" fill="#000000" text-anchor="middle" letter-spacing="1">PATCHCAT // ROUTER</text>

  <text x="232" y="52" class="font-heading black" font-size="14" fill="#000000" letter-spacing="0.5">CHEAP-FIRST CASCADE &amp; MULTI-CANDIDATE FAILOVER STATE MACHINE</text>
  <text x="895" y="51" class="font-mono bold" font-size="11" fill="#71717A" text-anchor="end">MODULE 3 ENGINE</text>

  <!-- ================= Left Column: Stage 1 Cheap-First (Width: 285) ================= -->
  <g transform="translate(25, 86)">
    <rect x="3" y="3" width="280" height="465" rx="6" fill="#000000" />
    <rect x="0" y="0" width="280" height="465" rx="6" fill="#FFFFFF" class="border-card" />

    <rect x="12" y="12" width="256" height="30" rx="4" fill="#ECFDF5" class="border-thin" />
    <text x="140" y="32" class="font-mono bolder" font-size="11" fill="#047857" text-anchor="middle">1. TIER-1 经济模型与自愈</text>

    <!-- Node: Input Request -->
    <rect x="16" y="54" width="248" height="52" rx="4" fill="#F8FAFC" class="border-thin" />
    <text x="26" y="74" class="font-mono bold" font-size="11" fill="#0F172A">INPUT: Task Prompt + Schema</text>
    <text x="26" y="94" class="font-mono" font-size="10" fill="#64748B">温度锁定: temperature=0.0</text>

    <!-- Arrow down -->
    <line x1="140" y1="106" x2="140" y2="122" stroke="#000000" stroke-width="2" marker-end="url(#arr-blk)" />

    <!-- Node: Qwen2.5-7B Cheap Tier -->
    <rect x="16" y="124" width="248" height="66" rx="4" fill="#DCFCE7" class="border-thin" />
    <text x="26" y="144" class="font-mono bolder" font-size="11" fill="#15803D">Tier 1: Qwen2.5-7B (免费通道)</text>
    <text x="26" y="162" class="font-mono" font-size="10" fill="#334155">首轮试探执行 (Speculative Run)</text>
    <text x="26" y="178" class="font-mono bold" font-size="10" fill="#166534">成本: $0.00 / ¥0.00</text>

    <!-- Arrow down -->
    <line x1="140" y1="190" x2="140" y2="206" stroke="#000000" stroke-width="2" marker-end="url(#arr-blk)" />

    <!-- Node: Contract & Local Healing -->
    <rect x="16" y="208" width="248" height="88" rx="4" fill="#FEF3C7" class="border-thin" />
    <text x="26" y="228" class="font-mono bolder" font-size="11" fill="#B45309">契约断言 &amp; 局部自愈循环</text>
    <text x="26" y="246" class="font-mono" font-size="10" fill="#78350F">Schema 验证: safeParseOutput</text>
    <text x="26" y="262" class="font-mono" font-size="10" fill="#78350F">轻度瑕疵: 局部状态机修复 (R &lt; 2)</text>
    <text x="26" y="280" class="font-mono bold" font-size="10" fill="#92400E">预算上限: maxCheapRetries=2</text>

    <!-- Arrow Split: Success -> 90% Closure -->
    <line x1="70" y1="296" x2="70" y2="330" stroke="#10B981" stroke-width="2" marker-end="url(#arr-lime)" />
    
    <!-- Box: 90% Zero Cost Closure -->
    <rect x="16" y="332" width="128" height="118" rx="4" fill="#10B981" class="border-thin" />
    <text x="80" y="356" class="font-heading black" font-size="18" fill="#FFFFFF" text-anchor="middle">90.0%</text>
    <text x="80" y="378" class="font-mono bold" font-size="10" fill="#FFFFFF" text-anchor="middle">流量经济闭环</text>
    <text x="80" y="398" class="font-mono" font-size="9" fill="#DCFCE7" text-anchor="middle">27/30 简单工单</text>
    <text x="80" y="416" class="font-mono" font-size="9" fill="#DCFCE7" text-anchor="middle">纯本地自愈消化</text>
    <text x="80" y="434" class="font-mono bolder" font-size="9" fill="#FACC15" text-anchor="middle">零强模型开销</text>

    <!-- Arrow Split: Failure -> Next Stage -->
    <path d="M 210 296 L 210 380 L 278 380" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-red)" />
    <text x="215" y="340" class="font-mono bold" font-size="10" fill="#DC2626">预算耗尽</text>
    <text x="215" y="356" class="font-mono bold" font-size="10" fill="#DC2626">或门禁拦截</text>
  </g>

  <!-- ================= Middle Column: Stage 2 Diagnostic Triplet & Triggers (Width: 320) ================= -->
  <g transform="translate(320, 86)">
    <rect x="3" y="3" width="315" height="465" rx="6" fill="#000000" />
    <rect x="0" y="0" width="315" height="465" rx="6" fill="#FFFFFF" class="border-card" />

    <rect x="12" y="12" width="291" height="30" rx="4" fill="#FEE2E2" class="border-thin" />
    <text x="157" y="32" class="font-mono bolder" font-size="11" fill="#DC2626" text-anchor="middle">2. 升级准入与现场三元组继承</text>

    <!-- Trigger Box: Dual Conditions -->
    <rect x="16" y="54" width="283" height="110" rx="4" fill="#FEF2F2" class="border-thin" />
    <text x="28" y="74" class="font-mono bolder" font-size="11" fill="#991B1B">双道升级准入判据 (Escalation Gates)</text>
    
    <rect x="26" y="84" width="263" height="32" rx="3" fill="#FFFFFF" class="border-thin" />
    <text x="36" y="98" class="font-mono bold" font-size="10" fill="#B91C1C">A. cheap_budget_exhausted</text>
    <text x="36" y="110" class="font-mono" font-size="9" fill="#7F1D1D">廉价层重试超限，契约硬崩溃 (如 #16, #23)</text>

    <rect x="26" y="122" width="263" height="34" rx="3" fill="#FFFFFF" class="border-thin" />
    <text x="36" y="136" class="font-mono bold" font-size="10" fill="#B91C1C">B. semantic_conflict_gate (F7 门禁)</text>
    <text x="36" y="149" class="font-mono" font-size="9" fill="#7F1D1D">问题描述词掩盖退款诉求，动作优先权拦截</text>

    <!-- Arrow down -->
    <line x1="157" y1="166" x2="157" y2="188" stroke="#000000" stroke-width="2" marker-end="url(#arr-blk)" />

    <!-- Diagnostic Triplet Assembler -->
    <rect x="16" y="190" width="283" height="152" rx="4" fill="#EFF6FF" class="border-thin" />
    <text x="28" y="212" class="font-mono bolder" font-size="11" fill="#1D4ED8">现场诊断三元组继承 (Diagnostic Triplet)</text>
    <text x="28" y="230" class="font-mono" font-size="10" fill="#3B82F6">拒绝冷启动！将现场上下文显式注入 Prompt:</text>

    <rect x="26" y="240" width="263" height="88" rx="3" fill="#DBEAFE" class="border-thin" />
    <text x="36" y="258" class="font-mono bold" font-size="10" fill="#1E40AF">1. rawOutput (前序原始生成文本)</text>
    <text x="36" y="276" class="font-mono bold" font-size="10" fill="#1E40AF">2. errorPath (契约失效字段路径定位)</text>
    <text x="36" y="294" class="font-mono bold" font-size="10" fill="#1E40AF">3. errorRule (业务红线与违例原因)</text>
    <text x="36" y="312" class="font-mono" font-size="9" fill="#1E3A8A">例: &quot;退款工单涉及资金流转 urgency 必须 ≥ 4&quot;</text>

    <!-- Arrow down to Escalation Dispatch -->
    <line x1="157" y1="344" x2="157" y2="370" stroke="#000000" stroke-width="2" marker-end="url(#arr-blk)" />

    <rect x="16" y="372" width="283" height="78" rx="4" fill="#F8FAFC" class="border-thin" />
    <text x="28" y="394" class="font-mono bolder" font-size="11" fill="#0F172A">定向升级分发 (Escalate)</text>
    <text x="28" y="412" class="font-mono" font-size="10" fill="#475569">全量保留任务上下文与诊断现场</text>
    <text x="28" y="430" class="font-mono bold" font-size="10" fill="#2563EB">激活 Tier 2 强模型多候选轮换队列 ➔</text>
  </g>

  <!-- ================= Right Column: Stage 3 Multi-Candidate Pool Failover (Width: 285) ================= -->
  <g transform="translate(650, 86)">
    <rect x="3" y="3" width="270" height="465" rx="6" fill="#000000" />
    <rect x="0" y="0" width="270" height="465" rx="6" fill="#FFFFFF" class="border-card" />

    <rect x="12" y="12" width="246" height="30" rx="4" fill="#F5F3FF" class="border-thin" />
    <text x="135" y="32" class="font-mono bolder" font-size="11" fill="#6D28D9" text-anchor="middle">3. 强模型轮换池与容灾自愈</text>

    <!-- Candidate 1 -->
    <rect x="16" y="54" width="238" height="70" rx="4" fill="#FAF5FF" class="border-thin" />
    <text x="26" y="74" class="font-mono bolder" font-size="11" fill="#581C87">#1: gemini-3.5-flash-lite</text>
    <text x="26" y="92" class="font-mono" font-size="10" fill="#6B21A8">首选候选模型 (Primary Candidate)</text>
    <text x="26" y="110" class="font-mono bold" font-size="10" fill="#DC2626">遇到 contract_fail / 429 报错</text>

    <!-- Failover Arrow 1 -->
    <line x1="135" y1="126" x2="135" y2="152" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-red)" />
    <text x="142" y="142" class="font-mono bold" font-size="9" fill="#DC2626">1.3s 自动转移</text>

    <!-- Candidate 2 (Hero) -->
    <rect x="16" y="154" width="238" height="76" rx="4" fill="#ECFDF5" class="border-thin" stroke="#059669" stroke-width="2" />
    <text x="26" y="174" class="font-mono bolder" font-size="11" fill="#047857">#2: gemini-3.1-flash-lite</text>
    <text x="26" y="192" class="font-mono bold" font-size="10" fill="#059669">次级接管 (Secondary Failover)</text>
    <text x="26" y="210" class="font-mono bolder" font-size="10" fill="#047857">实测救回: #16, #27 100% 修复!</text>

    <!-- Failover Arrow 2 -->
    <line x1="135" y1="232" x2="135" y2="258" stroke="#71717A" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-blk)" />
    <text x="142" y="248" class="font-mono" font-size="9" fill="#71717A">若仍异常 (兜底)</text>

    <!-- Candidate 3 -->
    <rect x="16" y="260" width="238" height="60" rx="4" fill="#F8FAFC" class="border-thin" />
    <text x="26" y="280" class="font-mono bolder" font-size="11" fill="#334155">#3: gemini-3.8-flash</text>
    <text x="26" y="298" class="font-mono" font-size="10" fill="#64748B">高阶强力兜底模型 (Final Defense)</text>

    <!-- Final Output Box -->
    <rect x="16" y="342" width="238" height="108" rx="4" fill="#0284C7" class="border-thin" />
    <text x="135" y="368" class="font-heading black" font-size="16" fill="#FFFFFF" text-anchor="middle">100.0% 救回率</text>
    <text x="135" y="390" class="font-mono bold" font-size="11" fill="#FFFFFF" text-anchor="middle">受处理子集 (3/3) 全部闭合</text>
    <text x="135" y="410" class="font-mono" font-size="10" fill="#E0F2FE" text-anchor="middle">全量契约合规率: 30/30 (100%)</text>
    <text x="135" y="428" class="font-mono bold" font-size="10" fill="#FEF08A" text-anchor="middle">业务零妥协 + 成本零支出</text>
  </g>

  <!-- ================= Bottom Ground Truth Metrics Bar (Width: 896, y=562) ================= -->
  <g transform="translate(25, 560)">
    <rect x="3" y="3" width="896" height="90" rx="6" fill="#000000" />
    <rect x="0" y="0" width="896" height="90" rx="6" fill="#18181B" class="border-card" />

    <!-- Metric 1: Consistency -->
    <rect x="14" y="14" width="206" height="62" rx="4" fill="#27272A" />
    <text x="26" y="36" class="font-mono bold" font-size="10" fill="#A1A1AA">未升级用例一致性</text>
    <text x="26" y="62" class="font-heading black" font-size="20" fill="#7FFF00">100.0% <tspan font-size="12" fill="#A1A1AA">(27/27)</tspan></text>

    <!-- Metric 2: Treated Cohort -->
    <rect x="236" y="14" width="206" height="62" rx="4" fill="#27272A" />
    <text x="248" y="36" class="font-mono bold" font-size="10" fill="#A1A1AA">Tier-2 强模型救回率</text>
    <text x="248" y="62" class="font-heading black" font-size="20" fill="#38BDF8">3 / 3 <tspan font-size="12" fill="#38BDF8">(100.0%)</tspan></text>

    <!-- Metric 3: Cheap Closure -->
    <rect x="458" y="14" width="206" height="62" rx="4" fill="#27272A" />
    <text x="470" y="36" class="font-mono bold" font-size="10" fill="#A1A1AA">流量经济闭环率</text>
    <text x="470" y="62" class="font-heading black" font-size="20" fill="#FACC15">90.0% <tspan font-size="12" fill="#A1A1AA">(27/30)</tspan></text>

    <!-- Metric 4: Token Overhead -->
    <rect x="680" y="14" width="202" height="62" rx="4" fill="#27272A" />
    <text x="692" y="36" class="font-mono bold" font-size="10" fill="#A1A1AA">单例救回 Token 开销</text>
    <text x="692" y="62" class="font-heading black" font-size="20" fill="#F87171">~2,890 <tspan font-size="12" fill="#A1A1AA">tokens</tspan></text>
  </g>
</svg>
