<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="lexicalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rrfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neoShadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="640" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="976" height="616" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Header Banner -->
  <rect x="28" y="24" width="944" height="54" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#neoShadow)"/>
  <text x="46" y="57" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="0.5">PATCHCAT · DUAL-CHANNEL HYBRID RETRIEVAL &amp; RRF PIPELINE</text>
  <rect x="734" y="36" width="222" height="30" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="746" y="56" font-size="11" font-weight="700" fill="#a5b4fc">ZERO BACKEND · 100% IN-BROWSER</text>

  <!-- COLUMN 1: Input Query & Tokenizer (Left: x=28, w=232) -->
  <g transform="translate(28, 96)">
    <rect width="232" height="376" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="2" filter="url(#neoShadow)"/>
    <rect x="12" y="12" width="208" height="28" rx="4" fill="#0284c7"/>
    <text x="20" y="31" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.5">1. INPUT QUERY STAGE</text>

    <!-- Query Input Box -->
    <rect x="12" y="52" width="208" height="74" rx="5" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="20" y="72" font-size="10.5" font-weight="700" fill="#94a3b8">RAW USER PROMPT QUERY</text>
    <rect x="18" y="80" width="196" height="34" rx="3" fill="#1e293b"/>
    <text x="24" y="102" font-size="11.5" font-family="monospace" font-weight="700" fill="#38bdf8">"Kahn Topo DAG_CYCLE"</text>

    <!-- Dispatch Note -->
    <rect x="12" y="140" width="208" height="110" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="162" font-size="11" font-weight="700" fill="#cbd5e1">Dual-Channel Fan-Out:</text>
    <text x="20" y="184" font-size="10" fill="#94a3b8">● Exact Error Identifiers</text>
    <text x="20" y="202" font-size="9.5" fill="#64748b">➔ Dispatched to BM25 Lexical</text>
    <text x="20" y="224" font-size="10" fill="#94a3b8">● Semantic Synonyms</text>
    <text x="20" y="242" font-size="9.5" fill="#64748b">➔ Dispatched to Dense Vector</text>

    <!-- Pipeline Status -->
    <rect x="12" y="264" width="208" height="96" rx="5" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="286" font-size="10.5" font-weight="700" fill="#34d399">✓ Zero Network Overhead</text>
    <text x="20" y="306" font-size="9.5" fill="#94a3b8">Runs purely in-memory</text>
    <text x="20" y="324" font-size="9.5" fill="#94a3b8">No external server calls</text>
    <text x="20" y="342" font-size="9" font-family="monospace" fill="#38bdf8">Latency: &lt; 5ms fan-out</text>
  </g>

  <!-- Connectors from Input to Middle Channels -->
  <path d="M 260 185 L 285 185 L 285 180 L 290 180" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 260 185 L 285 185 L 285 370 L 290 370" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- COLUMN 2: Parallel Channels (Middle: x=290, w=350) -->
  <g transform="translate(290, 96)">
    <!-- Channel A: BM25 Lexical (Top: h=180) -->
    <rect width="350" height="180" rx="8" fill="#061e16" stroke="#059669" stroke-width="2" filter="url(#neoShadow)"/>
    <rect x="0" y="0" width="350" height="30" rx="8" fill="url(#lexicalGrad)"/>
    <text x="16" y="20" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">CHANNEL A: LEXICAL BM25 (SPARSE INDEX)</text>

    <g transform="translate(14, 40)">
      <rect width="322" height="36" rx="4" fill="#0b2e22" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#a7f3d0">1. Bilingual Tokenizer (Zero-Dictionary)</text>
      <text x="10" y="30" font-size="9.5" font-family="monospace" fill="#6ee7b7">Regex + CJK Bi-gram + Exact Keyword Preserved</text>
    </g>

    <g transform="translate(14, 84)">
      <rect width="322" height="42" rx="4" fill="#0b2e22" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#a7f3d0">2. Smoothed Non-Negative IDF Formula</text>
      <text x="10" y="33" font-size="10" font-family="monospace" fill="#6ee7b7">IDF(q) = ln(1 + (N - n_q + 0.5) / (n_q + 0.5))</text>
    </g>

    <g transform="translate(14, 134)">
      <rect width="322" height="36" rx="4" fill="#0b2e22" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#a7f3d0">3. Okapi BM25 Ranking (k1=1.2, b=0.75)</text>
      <text x="10" y="30" font-size="10" fill="#34d399">Pinpoints exact tokens: #1 chunk_arch_03</text>
    </g>

    <!-- Channel B: Dense Vector (Bottom: y=196, h=180) -->
    <g transform="translate(0, 196)">
      <rect width="350" height="180" rx="8" fill="#1c1106" stroke="#d97706" stroke-width="2" filter="url(#neoShadow)"/>
      <rect x="0" y="0" width="350" height="30" rx="8" fill="url(#vectorGrad)"/>
      <text x="16" y="20" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">CHANNEL B: DENSE SEMANTIC VECTOR SEARCH</text>

      <g transform="translate(14, 40)">
        <rect width="322" height="36" rx="4" fill="#2d1808" stroke="#f59e0b" stroke-width="1"/>
        <text x="10" y="16" font-size="11" font-weight="700" fill="#fed7aa">1. Web Worker Quantized Neural Model</text>
        <text x="10" y="30" font-size="9.5" font-family="monospace" fill="#fdba74">BGE-small ONNX (~35MB) Isolated in Worker</text>
      </g>

      <g transform="translate(14, 84)">
        <rect width="322" height="42" rx="4" fill="#2d1808" stroke="#f59e0b" stroke-width="1"/>
        <text x="10" y="16" font-size="11" font-weight="700" fill="#fed7aa">2. Continuous Memory Dot-Product Scan</text>
        <text x="10" y="33" font-size="10" font-family="monospace" fill="#fdba74">Float32Array Linear Scan · Pre-normalized (L2=1)</text>
      </g>

      <g transform="translate(14, 134)">
        <rect width="322" height="36" rx="4" fill="#2d1808" stroke="#f59e0b" stroke-width="1"/>
        <text x="10" y="16" font-size="11" font-weight="700" fill="#fed7aa">3. Fuzzy Semantic Association</text>
        <text x="10" y="30" font-size="10" fill="#fb923c">Maps synonyms: "crash" ↔ "freeze" (score 0.94)</text>
      </g>
    </g>
  </g>

  <!-- Connectors from Channels to RRF -->
  <path d="M 640 185 L 655 185 L 655 240 L 670 240" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 640 380 L 655 380 L 655 320 L 670 320" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- COLUMN 3: Reciprocal Rank Fusion (Right: x=670, w=302) -->
  <g transform="translate(670, 96)">
    <rect width="302" height="376" rx="8" fill="#150f28" stroke="#8b5cf6" stroke-width="2" filter="url(#neoShadow)"/>
    <rect x="0" y="0" width="302" height="32" rx="8" fill="url(#rrfGrad)"/>
    <text x="16" y="21" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">RECIPROCAL RANK FUSION (RRF)</text>

    <!-- Formula Box -->
    <g transform="translate(14, 44)">
      <rect width="274" height="68" rx="5" fill="#221542" stroke="#a855f7" stroke-width="1.5"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#e9d5ff">Mathematical Formula (k = 60):</text>
      <text x="12" y="42" font-size="13" font-family="monospace" font-weight="800" fill="#c084fc">RRF(d) = ∑ 1 / (60 + rank_m(d))</text>
      <text x="12" y="60" font-size="10" fill="#a78bfa">Parameter-Free Ordinal Rank Blending</text>
    </g>

    <!-- Multi-line Formatted Benefits (Fully Contained Inside 302px Width) -->
    <g transform="translate(14, 126)">
      <!-- Benefit 1 -->
      <rect width="274" height="66" rx="4" fill="#0f0920" stroke="#4c1d95" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="700" fill="#38bdf8">✓ Zero Scale Gap Calibration</text>
      <text x="12" y="38" font-size="10" fill="#cbd5e1">Bypasses BM25 unbounded scores vs</text>
      <text x="12" y="54" font-size="10" fill="#94a3b8">Vector cosine bounded scale mismatch.</text>

      <!-- Benefit 2 -->
      <g transform="translate(0, 74)">
        <rect width="274" height="66" rx="4" fill="#0f0920" stroke="#4c1d95" stroke-width="1"/>
        <text x="12" y="20" font-size="11" font-weight="700" fill="#34d399">✓ Outlier Resistance</text>
        <text x="12" y="38" font-size="10" fill="#cbd5e1">Rank order strictly prevents single-node</text>
        <text x="12" y="54" font-size="10" fill="#94a3b8">score-dominating spikes or anomalies.</text>
      </g>

      <!-- Benefit 3 -->
      <g transform="translate(0, 148)">
        <rect width="274" height="68" rx="4" fill="#0f0920" stroke="#4c1d95" stroke-width="1"/>
        <text x="12" y="20" font-size="11" font-weight="700" fill="#fbbf24">✓ Dual Observability Invariant</text>
        <text x="12" y="38" font-size="10" fill="#cbd5e1">Guarantees exact codes rank #1 while</text>
        <text x="12" y="54" font-size="10" fill="#94a3b8">retaining deep fuzzy semantic context.</text>
      </g>
    </g>
  </g>

  <!-- Connect RRF down to Output -->
  <path d="M 821 472 L 821 484 L 500 484 L 500 496" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- BOTTOM SECTION: Final Output Telemetry (x=28, y=496, w=944, h=118) -->
  <g transform="translate(28, 496)">
    <rect width="944" height="118" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#neoShadow)"/>
    <text x="20" y="24" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="0.5">FINAL HYBRID RAG RECALL TELEMETRY (TOP-K CANDIDATE CHUNKS)</text>

    <!-- Chunk Item Mock with High Contrast -->
    <g transform="translate(16, 36)">
      <rect width="912" height="66" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="14" y="22" font-size="12" font-family="monospace" font-weight="800" fill="#38bdf8">[chunk_arch_03]</text>
      <text x="160" y="22" font-size="12" font-weight="700" fill="#f8fafc">RFC-101 Ch.3 Topological Deadlock Invariant &amp; Kahn Convergence Guarantee</text>

      <rect x="836" y="10" width="62" height="24" rx="4" fill="#059669"/>
      <text x="844" y="26" font-size="11" font-weight="800" fill="#ffffff">RANK #1</text>

      <!-- Telemetry Metric Badges -->
      <g transform="translate(14, 44)">
        <rect x="0" y="-12" width="130" height="22" rx="3" fill="#064e3b"/>
        <text x="8" y="3" font-size="10.5" font-family="monospace" font-weight="700" fill="#34d399">bm25_score: 8.421</text>

        <rect x="140" y="-12" width="135" height="22" rx="3" fill="#451a03"/>
        <text x="148" y="3" font-size="10.5" font-family="monospace" font-weight="700" fill="#fb923c">dense_score: 0.940</text>

        <rect x="285" y="-12" width="165" height="22" rx="3" fill="#2e1065"/>
        <text x="293" y="3" font-size="10.5" font-family="monospace" font-weight="700" fill="#c084fc">rrf_score: 0.03278689</text>

        <text x="470" y="3" font-size="10.5" font-family="monospace" fill="#94a3b8">matched_terms: ["kahn", "dag_cycle_detected", "topo"]</text>
      </g>
    </g>
  </g>
</svg>
