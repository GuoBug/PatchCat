<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="lexicalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="rrfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neoShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="580" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="936" height="556" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Header Banner -->
  <rect x="30" y="26" width="900" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#neoShadow)"/>
  <text x="50" y="58" font-size="17" font-weight="800" fill="#f8fafc" letter-spacing="0.5">PATCHCAT · DUAL-CHANNEL HYBRID RETRIEVAL &amp; RRF PIPELINE</text>
  <rect x="740" y="38" width="170" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="752" y="55" font-size="11" font-weight="700" fill="#38bdf8">ZERO BACKEND · PURE CLIENT</text>

  <!-- 1. Input Stage -->
  <g transform="translate(40, 102)">
    <rect width="250" height="84" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="2" filter="url(#neoShadow)"/>
    <text x="16" y="26" font-size="12" font-weight="800" fill="#38bdf8">INPUT QUERY</text>
    <rect x="16" y="36" width="218" height="34" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="24" y="58" font-size="12" font-family="monospace" fill="#e2e8f0">"Kahn 拓扑调度 DAG_CYCLE_DETECTED"</text>
  </g>

  <!-- Split Paths to Channels -->
  <path d="M 290 144 L 340 144 L 340 195 L 360 195" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 290 144 L 340 144 L 340 375 L 360 375" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- 2. Channel A: Lexical BM25 (Green Theme) -->
  <g transform="translate(365, 110)">
    <rect width="320" height="170" rx="6" fill="#061e16" stroke="#059669" stroke-width="2" filter="url(#neoShadow)"/>
    <rect x="0" y="0" width="320" height="28" rx="6" fill="url(#lexicalGrad)"/>
    <text x="14" y="19" font-size="12" font-weight="800" fill="#ffffff">CHANNEL A: LEXICAL BM25 (SPARSE INDEX)</text>

    <!-- Sub-steps -->
    <g transform="translate(14, 38)">
      <rect width="292" height="34" rx="4" fill="#0b2e22" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#a7f3d0">1. Hybrid Tokenizer (Zero Dictionary)</text>
      <text x="10" y="28" font-size="10" font-family="monospace" fill="#6ee7b7">Regex + CJK Bi-gram + Bilingual Stopwords</text>
    </g>

    <g transform="translate(14, 80)">
      <rect width="292" height="38" rx="4" fill="#0b2e22" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#a7f3d0">2. Smoothed Non-Negative IDF Formula</text>
      <text x="10" y="30" font-size="10" font-family="monospace" fill="#6ee7b7">IDF(q) = ln(1 + (N - n_q + 0.5) / (n_q + 0.5))</text>
    </g>

    <g transform="translate(14, 126)">
      <rect width="292" height="32" rx="4" fill="#0b2e22" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="15" font-size="11" font-weight="700" fill="#a7f3d0">3. Okapi BM25 Ranking (k1=1.5, b=0.75)</text>
      <text x="10" y="26" font-size="10" fill="#34d399">Precision identifier match: #1 chunk_arch_03</text>
    </g>
  </g>

  <!-- 3. Channel B: Dense Vector (Orange Theme) -->
  <g transform="translate(365, 298)">
    <rect width="320" height="152" rx="6" fill="#1c1106" stroke="#ea580c" stroke-width="2" filter="url(#neoShadow)"/>
    <rect x="0" y="0" width="320" height="28" rx="6" fill="url(#vectorGrad)"/>
    <text x="14" y="19" font-size="12" font-weight="800" fill="#ffffff">CHANNEL B: DENSE SEMANTIC RETRIEVAL</text>

    <!-- Sub-steps -->
    <g transform="translate(14, 38)">
      <rect width="292" height="34" rx="4" fill="#2d1808" stroke="#f97316" stroke-width="1"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#fed7aa">1. Sliding N-Gram &amp; Vector Fingerprint</text>
      <text x="10" y="28" font-size="10" font-family="monospace" fill="#fdba74">Domain-Agnostic N-gram (2/3/4-gram)</text>
    </g>

    <g transform="translate(14, 80)">
      <rect width="292" height="34" rx="4" fill="#2d1808" stroke="#f97316" stroke-width="1"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#fed7aa">2. Contextual Similarity Matrix</text>
      <text x="10" y="28" font-size="10" font-family="monospace" fill="#fdba74">Cosine / Fingerprint Dense Score ∈ [0.0, 0.96]</text>
    </g>

    <g transform="translate(14, 122)">
      <text x="10" y="18" font-size="10" fill="#fb923c">Robust against synonyms: "拓扑" ↔ "调度"</text>
    </g>
  </g>

  <!-- Convergence Arrows to RRF -->
  <path d="M 685 195 L 715 195 L 715 300 L 735 300" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M 685 375 L 715 375 L 715 320 L 735 320" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- 4. RRF Fusion Stage (Purple Theme) -->
  <g transform="translate(740, 180)">
    <rect width="185" height="250" rx="6" fill="#150f28" stroke="#8b5cf6" stroke-width="2" filter="url(#neoShadow)"/>
    <rect x="0" y="0" width="185" height="32" rx="6" fill="url(#rrfGrad)"/>
    <text x="10" y="21" font-size="11" font-weight="800" fill="#ffffff">RECIPROCAL RANK FUSION</text>

    <!-- Formula Box -->
    <g transform="translate(10, 42)">
      <rect width="165" height="58" rx="4" fill="#221542" stroke="#a855f7" stroke-width="1"/>
      <text x="8" y="18" font-size="10" font-weight="700" fill="#e9d5ff">Formula (k = 60):</text>
      <text x="8" y="34" font-size="11" font-family="monospace" font-weight="700" fill="#c084fc">RRF(d) = ∑ w_m / (k + r_m)</text>
      <text x="8" y="48" font-size="9" fill="#a855f7">Zero Parameter Calibration</text>
    </g>

    <!-- Characteristics -->
    <g transform="translate(10, 108)">
      <text x="6" y="14" font-size="10" font-weight="700" fill="#d8b4fe">✓ No Score Scale Gap</text>
      <text x="6" y="28" font-size="9" fill="#94a3b8">Bypasses BM25 unbounded vs Vector cosine scale mismatch</text>

      <text x="6" y="50" font-size="10" font-weight="700" fill="#d8b4fe">✓ Outlier Resistance</text>
      <text x="6" y="64" font-size="9" fill="#94a3b8">Rank order prevents score dominating anomalies</text>

      <text x="6" y="86" font-size="10" font-weight="700" fill="#d8b4fe">✓ Dual Observability</text>
      <text x="6" y="100" font-size="9" fill="#94a3b8">Attaches bm25, dense, &amp; rrf scores to all chunks</text>
    </g>
  </g>

  <!-- Bottom Output Pipeline -->
  <g transform="translate(40, 470)">
    <rect width="885" height="84" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#neoShadow)"/>
    <text x="18" y="24" font-size="12" font-weight="800" fill="#38bdf8">FINAL HYBRID RAG RECALL TELEMETRY (TOP-K CHUNKS)</text>

    <!-- Chunk Item Mock -->
    <g transform="translate(18, 34)">
      <rect width="849" height="38" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="14" y="18" font-size="11" font-family="monospace" font-weight="700" fill="#38bdf8">[chunk_arch_03]</text>
      <text x="150" y="18" font-size="11" fill="#f1f5f9">RFC-101 第3章 拓扑环路死锁检测与防御 (Kahn 算法收敛性不变式)</text>
      <text x="14" y="31" font-size="10" font-family="monospace" fill="#10b981">bm25_score: 8.421</text>
      <text x="160" y="31" font-size="10" font-family="monospace" fill="#f97316">dense_score: 0.94</text>
      <text x="300" y="31" font-size="10" font-family="monospace" fill="#c084fc">rrf_score: 0.03278689</text>
      <text x="490" y="31" font-size="10" font-family="monospace" fill="#94a3b8">matched_terms: ["kahn", "dag_cycle_detected", "拓扑"]</text>
      <rect x="790" y="8" width="48" height="20" rx="3" fill="#059669"/>
      <text x="798" y="22" font-size="10" font-weight="800" fill="#ffffff">RANK #1</text>
    </g>
  </g>

  <!-- Connect RRF down to Output -->
  <path d="M 832 430 L 832 450 L 500 450 L 500 470" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
</svg>
