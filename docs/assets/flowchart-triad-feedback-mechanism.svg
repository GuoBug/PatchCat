  <text x="196" y="47" class="font-heading bold" font-size="13.5" fill="#000000" letter-spacing="0.5">L3 TRIAD DIAGNOSTIC &amp; SELF-HEALING ARCHITECTURE</text>
  <text x="756" y="47" class="font-mono" font-size="10" fill="#52525B">RUNTIME PRECISION v0.4.12</text>

