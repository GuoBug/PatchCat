name: Build Merlin Router Package (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-merlin:
    name: Build ASUS Merlin Koolshare Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend & Merlin Package
        run: |
          node scripts/build-target.mjs --target=merlin --arch=arm64

      - name: Generate Checksum
        run: |
          sha256sum patchcat-merlin-arm64.tar.gz > patchcat-merlin-arm64.tar.gz.sha256
          cat patchcat-merlin-arm64.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patchcat-merlin-arm64
          path: |
            patchcat-merlin-arm64.tar.gz
            patchcat-merlin-arm64.tar.gz.sha256

      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            patchcat-merlin-arm64.tar.gz
            patchcat-merlin-arm64.tar.gz.sha256
          generate_release_notes: true
