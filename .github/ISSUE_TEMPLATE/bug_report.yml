name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in PatchCat
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🐱
        Please fill out the sections below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I click the 'Run Workflow' button with a conditional branch node, the execution..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Open PatchCat in browser
        2. Create a workflow with Input → LLM → Output
        3. Click 'Run Workflow'
        4. See error in console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or screenshots if possible.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Storage Mode
      description: Which storage mode were you using?
      options:
        - Local Storage (Browser Only)
        - Server Mode (FastAPI Backend)
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LLM Provider
      description: Which LLM provider were you using? (if applicable)
      options:
        - Google Gemini
        - DeepSeek
        - OpenAI
        - SiliconFlow
        - Ollama (Local)
        - Custom OpenAI-Compatible
        - Not applicable
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser & Version
      description: e.g., Chrome 128, Firefox 130, Edge 128
      placeholder: "Chrome 128"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g., Windows 11, macOS 15, Ubuntu 24.04
      placeholder: "Windows 11"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PatchCat Version
      description: Check the footer or package.json for the version number
      placeholder: "v0.2.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console Logs
      description: Paste any relevant browser console output or PatchCat Log Console output here.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop screenshots here if applicable.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this bug has not been reported before.
          required: true
        - label: I have tested with the latest version of PatchCat.
          required: false
